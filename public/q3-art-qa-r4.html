<html><style>body{background:#17221f;color:#f2dbb4;font:18px system-ui}canvas{margin:8px;border:4px solid #d6ad72;max-width:97vw;height:auto}</style><main id="qa"></main><script type="module">
import {initPremiumGiant,premiumGiantReady,paintPremiumGiantFloor,paintPremiumGiantWalls,paintPremiumGiantActor} from './v2-premium-giantwood.mjs?v=q3r4';
const walls=await (await fetch('./q3-r4-walls.json')).json();initPremiumGiant();
const r=['q3r1','q3r2','q3r3','q3r4','q3r5'];
await new Promise((resolve,reject)=>{const t=Date.now();const f=()=>{if(r.every(premiumGiantReady))return resolve();if(Date.now()-t>15000)return reject(new Error('art load timeout'));setTimeout(f,100)};f()});
for(const id of r){const p=document.createElement('div');const h=document.createElement('h3');h.textContent=id;p.append(h);let canv=document.createElement('canvas');canv.width=1152;canv.height=896;p.append(canv);document.querySelector('main').append(p);
 const ctx=canv.getContext('2d');const c=128,s={cell:c,originX:0,originY:0,iso:false,at(x,y){return {x:(x+.5)*c,y:(y+.5)*c}}};paintPremiumGiantFloor(ctx,s,id);paintPremiumGiantWalls(ctx,s,id,walls[id]);
 if(id==='q3r5')paintPremiumGiantActor(ctx,s,{x:5,y:3,faces:12,hp:45,maxHp:60,variant:'boss'},'enemy','Boss D12',false,0,false,true);
}
window.visualDone=true;
</script></html>
